authenticationProviders=inMemory

spring.session.timeout=30

elasticsearch.create.indices: false


###### Bypass authorization (but not authentication!) #######
authorization.permitall = false

############## Authorization Roles ################
# If authorization.permitall=false, then user must have role.admin to manage
# logbooks, tags, levels, properties and templates.
# This property defines the *name* of the admin role/group.
role.admin=admin
