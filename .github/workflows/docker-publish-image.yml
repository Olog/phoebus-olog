name: Build and Publish Docker Image

# Publish Docker image on pushes to master and INFN integration branches, or on-demand.
# Only master gets :latest and the plain version tag; other branches get :<branch>
# and :<version>-<timestamp>, so deployments on :latest are not affected.
on:
  push:
    branches:
      - 'master'
      - 'infn/**'
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Get/Set Tag Info
        id: project-info
        run: ./scripts/write-project-info.sh && ./scripts/set-github-env.sh
      - name: Select Tags
        id: tags
        env:
          IMAGE_NAME: ${{ steps.project-info.outputs.IMAGE_NAME }}
          TAG_LATEST: ${{ steps.project-info.outputs.IMAGE_TAG_LATEST }}
          TAG_VERSION: ${{ steps.project-info.outputs.IMAGE_TAG_VERSION }}
          TAG_VERSION_TIMESTAMP: ${{ steps.project-info.outputs.IMAGE_TAG_VERSION_TIMESTAMP }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_NAME" = "master" ]; then
            TAGS="$TAG_LATEST,$TAG_VERSION,$TAG_VERSION_TIMESTAMP"
          else
            BRANCH_TAG=$(echo "$REF_NAME" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9._\n-' '-')
            TAGS="$IMAGE_NAME:$BRANCH_TAG,$TAG_VERSION_TIMESTAMP"
          fi
          echo "Will build docker image for $TAGS"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, Tag, and Publish Docker Image
        uses: docker/build-push-action@v3
        with:
          context: .
          tags: ${{ steps.tags.outputs.tags }}
          push: true